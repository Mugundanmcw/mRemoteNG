name: Build mR-NB

on:
  push:
    branches:
      - woa
  
jobs:
  Build-Release:
    strategy:
      matrix:
        include:
          - os: windows-2022
            platform: x64
            architecture: x64
          - os: windows-11-arm
            platform: ARM64
            architecture: arm64
    runs-on: ${{ matrix.os }}
    outputs:
      zipname-x64: ${{ steps.version.outputs.zipname-x64 }}
      zipname-arm64: ${{ steps.version.outputs.zipname-arm64 }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: 01. Checkout Repository
        uses: actions/checkout@v4

      - name: 02. Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.14.11'
          
      - name: Install and run dotnet-t4 to transform T4 templates
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-t4
          $ttFile = "$env:GITHUB_WORKSPACE\mRemoteNG\Properties\AssemblyInfo.tt"
          t4 $ttFile
  
      - name: 04. Cache NuGet Packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.architecture }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.architecture }}-nuget-

      - name: 05. Restore NuGet Packages
        shell: pwsh
        run: dotnet restore

      - name: 06. Build Release
        shell: pwsh
        run: msbuild "$Env:GITHUB_WORKSPACE\mRemoteNG.sln" -p:Configuration="Release" -p:Platform=${{ matrix.platform }} /verbosity:minimal

      - name: 07. Generate Version Info
        id: version
        shell: pwsh
        run: |
          $assemblyInfoPath = "${{ github.workspace }}\mRemoteNG\Properties\AssemblyInfo.cs"
          $line = Get-Content $assemblyInfoPath | Where-Object { $_ -match 'AssemblyVersion\("(.+?)"\)' }
          if ($line -match 'AssemblyVersion\("(?<ver>\d+\.\d+\.\d+)\.(?<build>\d+)"\)') {
            $version = $matches['ver']
            $build = $matches['build']
          } else {
            throw "Could not extract version and build number"
          }
          $date = Get-Date -Format "ddMMyyyy"
          $architecture = "${{ matrix.architecture }}"
          $zipName = "mRemoteNG-$version-(NB_$build)_${date}_$architecture.zip"
          
          echo "zipname-$architecture=$zipName" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "build=$build" >> $env:GITHUB_OUTPUT
          
      - name: 08. Upload Release Output as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mRemoteNG-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}-${{ matrix.architecture }}
          path: ${{ github.workspace }}\mRemoteNG\bin\${{ matrix.platform }}\Release\win-${{ matrix.architecture }}\*

  Create-Release:
    needs: [Build-Release]
    runs-on: ubuntu-22.04
    # Add explicit permissions for this job
    permissions:
      contents: write
      
    steps:
      - name: 01. Checkout Repository
        uses: actions/checkout@v4
        
      - name: 02a. Download x64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: mRemoteNG-${{ needs.Build-Release.outputs.version }}-${{ needs.Build-Release.outputs.build }}-x64
          path: ./artifacts/x64/

      - name: 02b. Download ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: mRemoteNG-${{ needs.Build-Release.outputs.version }}-${{ needs.Build-Release.outputs.build }}-arm64
          path: ./artifacts/arm64/

      - name: 02c. Create ZIP files
        shell: bash
        run: |
          cd artifacts/x64
          zip -r "../../${{ needs.Build-Release.outputs.zipname-x64 }}" .
          cd ../arm64
          zip -r "../../${{ needs.Build-Release.outputs.zipname-arm64 }}" .
          cd ../..

      - name: !!!. Debug Info
        run: |
          echo "=== DEBUG: Job Outputs ==="
          echo "Zipname x64: ${{ needs.Build-Release.outputs.zipname-x64 }}"
          echo "Zipname ARM64: ${{ needs.Build-Release.outputs.zipname-arm64 }}"
          echo "Version: ${{ needs.Build-Release.outputs.version }}"
          echo "Build: ${{ needs.Build-Release.outputs.build }}"
          echo "=== DEBUG: Files ==="
          ls -la

          
      - name: 03. Create Release and Upload Assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create tag name
          TAG="v${{ needs.Build-Release.outputs.version }}-${{ needs.Build-Release.outputs.build }}-${GITHUB_RUN_NUMBER}"
          echo "Tag: v${{ needs.Build-Release.outputs.version }}-${{ needs.Build-Release.outputs.build }}-${GITHUB_RUN_NUMBER}"
          
          # Create release with tag and attach both artifacts
          gh release create "$TAG" \
            --title "mRemoteNG ${{ needs.Build-Release.outputs.version }} Build ${{ needs.Build-Release.outputs.build }}" \
            --notes "Development build of mRemoteNG version ${{ needs.Build-Release.outputs.version }} - Available for both x64 and ARM64 architectures" \
            --prerelease \
            "${{ needs.Build-Release.outputs.zipname-x64 }}" \
            "${{ needs.Build-Release.outputs.zipname-arm64 }}"
